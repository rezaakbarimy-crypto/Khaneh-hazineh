<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مدیریت هزینه‌ها</title>
<meta name="theme-color" content="#1E3A34">
<meta name="description" content="حساب‌وکتاب ماهانه هزینه و واریزی‌های خانواده">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدیریت هزینه‌ها">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EDE6D6;
    --paper-2: #E3D9C2;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --navy: #1E3A34;
    --navy-2: #142823;
    --gold: #B8863B;
    --gold-soft: #D9B876;
    --brick: #A6462E;
    --line: #C9BC9C;
    --good: #2F6B4F;
    --bad: #A6462E;
    --card-shadow: 0 1px 0 rgba(43,38,32,0.06);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; }
  body{
    margin:0;
    font-family: 'Vazirmatn', sans-serif;
    background: var(--paper);
    color: var(--ink);
    direction: rtl;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 16px 60px;
  }

  /* ---------- Header / Ledger title ---------- */
  .ledger-head{
    background: var(--navy);
    color: var(--paper);
    border-radius: 14px;
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .ledger-head::before{
    content:"";
    position:absolute;
    inset:6px;
    border: 1px solid rgba(217,184,118,0.35);
    border-radius: 9px;
    pointer-events:none;
  }
  .ledger-head h1{
    margin:0 0 4px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }
  .ledger-head p{
    margin:0;
    font-size: 12.5px;
    color: var(--gold-soft);
    font-weight: 500;
  }
  .month-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .month-row select{
    flex:1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(217,184,118,0.4);
    color: var(--paper);
    font-family:inherit;
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 8px;
  }
  .month-row select option{ color:#111; }

  .book-tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .book-tab{
    flex:1;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight:700;
    color: var(--ink-soft);
    cursor:pointer;
    text-align:center;
  }
  .book-tab.active{
    background: var(--navy);
    color: var(--paper);
    border-color: var(--navy);
  }

  /* ---------- Section cards ---------- */
  .card{
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--card-shadow);
  }
  .card h2{
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2::before{
    content:"";
    width:5px; height:5px;
    background: var(--gold);
    border-radius:50%;
    display:inline-block;
  }

  /* ---------- Contributors ---------- */
  .contributors{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .contrib-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 11px;
  }
  .contrib-row .name{
    font-size: 14px;
    font-weight: 600;
    min-width: 52px;
  }
  .contrib-row input{
    flex:1;
    border:none;
    background: transparent;
    text-align:left;
    font-family: inherit;
    font-size: 14.5px;
    font-weight:600;
    color: var(--navy);
    padding: 4px 2px;
    direction: ltr;
  }
  .contrib-row input:focus{ outline:none; }
  .contrib-row .unit{ font-size:11.5px; color:var(--ink-soft); }

  .income-total{
    margin-top: 12px;
    display:flex;
    justify-content: space-between;
    align-items:baseline;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .income-total b{
    color: var(--good);
    font-size: 16px;
  }

  /* ---------- Add expense form ---------- */
  .form-grid{
    display:flex;
    flex-direction: column;
    gap: 9px;
  }
  .form-grid select, .form-grid input{
    width:100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 11px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  .form-grid input::placeholder{ color: #9c927e; }
  .two-col{ display:flex; gap:9px; }
  .two-col > *{ flex:1; }
  .add-btn{
    margin-top: 2px;
    background: var(--navy);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .add-btn:active{ background: var(--navy-2); }
  .clear-btn{
    margin-top: 2px;
    background: transparent;
    color: var(--brick);
    border: 1px solid var(--brick);
    border-radius: 8px;
    padding: 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    flex: 0 0 90px;
  }
  .clear-btn:active{ background: rgba(166,70,46,0.1); }
  .form-grid textarea{
    width:100%;
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 11px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    resize: vertical;
    direction: rtl;
  }
  .form-grid textarea::placeholder{ color: #9c927e; }
  #smsResult:empty{ display:none; }
  #smsResult{
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 10px 11px;
    font-size: 12.5px;
    line-height: 1.9;
  }
  #smsResult .sms-line{ margin-bottom: 4px; }
  #smsResult .sms-warn{ color: var(--brick); font-weight:600; }
  #smsResult .sms-ok{ color: var(--good); font-weight:600; }
  .sms-choice-row{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .sms-choice-btn{
    background: var(--navy);
    color: var(--paper);
    border:none;
    border-radius: 7px;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .sms-choice-btn.secondary{
    background: transparent;
    border: 1px solid var(--navy);
    color: var(--navy);
  }
  .jalali-date-row{ display:flex; gap:6px; }
  .jalali-date-row select{
    flex:1;
    min-width:0;
    font-family: inherit;
    font-size: 13px;
    padding: 10px 4px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    text-align:center;
  }

  /* ---------- Expense list ---------- */
  .expense-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .expense-item:last-child{ border-bottom:none; }
  .cat-dot{
    width:9px; height:9px;
    border-radius: 3px;
    flex-shrink:0;
  }
  .expense-info{ flex:1; min-width:0; }
  .expense-info .cat{ font-size:13.5px; font-weight:600; }
  .expense-info .note{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .expense-amt{
    font-size: 14px;
    font-weight: 700;
    color: var(--brick);
    white-space:nowrap;
  }
  .del-btn{
    border:none; background:none; color:#9c927e;
    font-size:16px; cursor:pointer; padding:2px 4px;
    line-height:1;
  }
  .empty-note{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 14px 0 6px;
  }

  /* ---------- Category breakdown ---------- */
  .cat-row{
    margin-bottom: 10px;
  }
  .cat-row .cat-top{
    display:flex; justify-content:space-between;
    font-size: 12.5px;
    margin-bottom: 4px;
  }
  .cat-row .cat-top .lbl{ font-weight:600; display:flex; align-items:center; gap:6px; }
  .cat-row .cat-top .val{ color: var(--ink-soft); font-weight:600; }
  .bar-bg{
    background: var(--paper);
    border-radius: 5px;
    height: 7px;
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .bar-fill{
    height:100%;
    border-radius: 5px;
  }

  /* ---------- Summary ---------- */
  .summary-grid{
    display:flex;
    gap:10px;
  }
  .summary-box{
    flex:1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 10px;
    text-align:center;
  }
  .summary-box .lbl{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .summary-box .num{ font-size:15px; font-weight:800; }
  .summary-box.income .num{ color: var(--good); }
  .summary-box.expense .num{ color: var(--brick); }
  .balance-pos{ color: var(--good) !important; }
  .balance-neg{ color: var(--brick) !important; }

  .footnote{
    text-align:center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  .ledger-warn{
    color: var(--brick);
    font-weight:700;
    font-size: 12.5px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .ledger-sub{
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .danger-btn{
    width:100%;
    background: transparent;
    color: var(--brick);
    border: 1.5px solid var(--brick);
    border-radius: 9px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight:700;
    cursor:pointer;
  }
  .danger-btn:active{
    background: var(--brick);
    color: var(--paper);
  }

  .kind-btn{
    flex:1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight:700;
    color: var(--ink-soft);
    cursor:pointer;
    text-align:center;
  }
  .kind-btn.active{
    background: var(--navy);
    color: var(--paper);
    border-color: var(--navy);
  }

  #installBar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 12.5px;
  }
  #installBar button{
    background: var(--navy);
    color: var(--paper);
    border:none;
    border-radius: 7px;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight:700;
  }

  .book-section{
    margin-bottom: 26px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--gold-soft);
  }
  .book-section:last-child{ border-bottom: none; }
  .book-section-head{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    gap:8px;
    margin: 4px 2px 12px;
  }
  .book-section-head h2{
    margin:0;
    font-size: 16px;
    font-weight:800;
    color: var(--navy);
  }
  .book-section-head .ledger-sub{
    font-weight:700;
    color: var(--gold);
  }
</style>
</head>
<body>

  <div id="installBar">

  <div class="ledger-head">
    <h1>مدیریت هزینه‌ها</h1>
    <div class="month-row">

    </div>
  </div>

  <div class="book-tabs" id="bookTabs"></div>

  <div id="bookSections"></div>

  <div class="footnote">اطلاعات فقط روی همین گوشی شما ذخیره می‌شود</div>
</div>

<script>
(function(){
  const CATEGORIES = [

    { key: 'aghzie', label: 'اغذیه', color: '#5C7A6B', subs: [

      { key: 'hobubat', label: 'حبوبات' },

      { key: 'mive_tarebar', label: 'میوه و تره‌بار' },

      { key: 'tanaghol', label: 'تنقلات' },

    ]},
    { key: 'ellbase', label: 'البسه و پوشاک', color: '#3E6B8A', subs: [

      { key: 'kharid_poushak', label: 'خرید پوشاک' },
      { key: 'khoshkshooyi', label: 'خشک‌شویی' },
      { key: 'sayer', label: 'سایر' },
    ]},
    { key: 'khodro', label: 'خودرو', color: '#4A8FA8', subs: [
      { key: 'benzin', label: 'بنزین' },
      { key: 'taviz_roghan', label: 'تعویض روغن' },
      { key: 'jaraem', label: 'جرایم رانندگی' },
      { key: 'tarh_traffic', label: 'طرح ترافیک' },
      { key: 'parking', label: 'پارکینگ' },
      { key: 'bimeh_sales', label: 'بیمه ثالث' },
      { key: 'bimeh_badaneh', label: 'بیمه بدنه' },
      { key: 'tamirat_asasi', label: 'تعمیرات اساسی' },
      { key: 'avarez_khodro', label: 'عوارض خودرو' },
      { key: 'sayer', label: 'سایر' },
    ]},
    { key: 'iyab', label: 'ایاب و ذهاب', color: '#C9A227', subs: [
      { key: 'ajans', label: 'کرایه آژانس' },
      { key: 'taxi', label: 'کرایه تاکسی' },
      { key: 'otobus', label: 'کرایه اتوبوس' },

      { key: 'belit_havapeyma', label: 'بلیط هواپیما' },

    ]},
    { key: 'amoozesh', label: 'آموزش و تحصیل', color: '#7A5C8A', subs: [
      { key: 'varzeshi', label: 'کلاس‌های ورزشی' },
      { key: 'shahrieh_madrese', label: 'شهریه مدرسه' },

      { key: 'shahrieh_mahdkodak', label: 'شهریه مهدکودک' },

      { key: 'kelas_amoozeshi', label: 'کلاس‌های آموزشی' },

    ]},
    { key: 'farhangi', label: 'فرهنگی و سرگرمی', color: '#8A6D3B', subs: [
      { key: 'narmafzar', label: 'نرم‌افزار' },

      { key: 'sayer', label: 'سایر' },
    ]},
    { key: 'behdashti', label: 'بهداشتی و درمانی', color: '#A6462E', subs: [
      { key: 'vizit', label: 'ویزیت پزشک' },
      { key: 'lavazem_behdashti', label: 'لوازم بهداشتی' },
      { key: 'lavazem_arayeshi', label: 'لوازم آرایشی' },
      { key: 'lavazem_pezeshki', label: 'لوازم پزشکی' },
      { key: 'dandanpezeshki', label: 'دندانپزشکی' },
      { key: 'jarrahi', label: 'جراحی' },
      { key: 'bastari', label: 'بستری' },

      { key: 'daru', label: 'دارو' },
      { key: 'sayer', label: 'سایر' },
    ]},
  ];

  // Old flat categories (from before this update) mapped onto the new taxonomy,
  // so previously saved expenses keep displaying and totaling correctly.
  const LEGACY_CATEGORY_MAP = {
    khorak: ['aghzie', 'sayer'],
    tafrih: ['farhangi', 'sayer'],
    mosaferat: ['iyab', 'sayer'],
    ab: ['maskan', 'ab'],
    bargh: ['maskan', 'bargh'],
    telefon: ['maskan', 'telefon'],
    maliat: ['maskan', 'avarez_shahrdari'],
    sayer: ['maskan', 'sayer'],
  };

  function resolveExpenseCategory(exp){
    let mainKey = exp.mainCat, subKey = exp.subCat;
    if(!mainKey && exp.category){
      const mapped = LEGACY_CATEGORY_MAP[exp.category];
      if(mapped){ mainKey = mapped[0]; subKey = mapped[1]; }
    }
    const group = CATEGORIES.find(g => g.key === mainKey) || CATEGORIES[0];
    const sub = group.subs.find(s => s.key === subKey) || group.subs[group.subs.length - 1];
    return { group, sub };
  }

  const BOOKS = [
    { key: 'book1', label: 'خانه و خانواده', bank: 'بانک سپه', contributors: [
      { key: 'maryam', label: 'مریم' },
      { key: 'sara', label: 'سارا' },
      { key: 'parsa', label: 'پارسا' },
    ]},
    { key: 'book2', label: 'Me❤️Her', bank: 'بانک ملت', contributors: [
      { key: 'reza', label: 'Reza' },
      { key: 'azertim', label: 'Azertima' },
    ]},
  ];

  // Colors for "money given to a person" slices in the breakdown chart —
  // separate from CATEGORIES' colors so the two kinds stay visually distinct.
  const PERSON_COLORS = ['#7C5295', '#B0455E', '#3E6E8E', '#8E5B3F', '#4C6B52'];
  function personColor(book, personKey){
    const idx = book.contributors.findIndex(c => c.key === personKey);
    return PERSON_COLORS[idx >= 0 ? idx % PERSON_COLORS.length : 0];

  const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

  function fmt(n){
    n = Math.round(n||0);
    return n.toLocaleString('en-US');
  }

  // ---- Live thousands-separator formatting for number-entry text inputs ----
  function getRawNumber(input){
    return Number((input.value || '').replace(/[^\d]/g, '')) || 0;
  }

  function attachThousandsFormatting(input){
    input.addEventListener('input', () => {
      const raw = input.value.replace(/[^\d]/g, '');

  // ---- Gregorian <-> Jalali (Persian solar) calendar conversion ----
  // Uses the standard 33-year leap-cycle break table to locate each Jalali
  // year's Nowruz (New Year) date, then measures day-offsets with native
  // Date/UTC math (which already handles Gregorian leap years correctly).
  function div(a, b){ return Math.floor(a / b); }
  function mod(a, b){ return a - Math.floor(a / b) * b; }

  const JALALI_BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

  function jalCal(jy){
    let bl = JALALI_BREAKS.length, gy = jy + 621, leapJ = -14, jp = JALALI_BREAKS[0], jm, jump = 0, n, i;
    for(i = 1; i < bl; i += 1){
      jm = JALALI_BREAKS[i];
      jump = jm - jp;
      if(jy < jm) break;
      leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if(mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG; // day-of-March that Farvardin 1 falls on
    return { gy, march };
  }

  function gregorianToJalali(gy, gm, gd){
    let jy = gy - 621;
    let r = jalCal(jy);
    let nowruz = Date.UTC(r.gy, 2, r.march);
    const target = Date.UTC(gy, gm - 1, gd);
    let diffDays = Math.round((target - nowruz) / 86400000);
    if(diffDays < 0){
      jy -= 1;
      r = jalCal(jy);
      nowruz = Date.UTC(r.gy, 2, r.march);
      diffDays = Math.round((target - nowruz) / 86400000);
    }
    let jm, jd;
    if(diffDays <= 185){
      jm = 1 + div(diffDays, 31);
      jd = mod(diffDays, 31) + 1;
    } else {
      const k = diffDays - 186;
      jm = 7 + div(k, 30);
      jd = mod(k, 30) + 1;
    }
    return { jy, jm, jd };
  }

  function shiftJalaliMonth(jy, jm, offset){
    const total = (jy * 12 + (jm - 1)) + offset;
    return { jy: Math.floor(total / 12), jm: mod(total, 12) + 1 };
  }

  function jMonthKey(jy, jm){
    return jy + '-' + String(jm).padStart(2, '0');
  }

  function isLeapJalaliYear(jy){
    const nowruzThis = Date.UTC(jalCal(jy).gy, 2, jalCal(jy).march);
    const nowruzNext = Date.UTC(jalCal(jy + 1).gy, 2, jalCal(jy + 1).march);
    return Math.round((nowruzNext - nowruzThis) / 86400000) === 366;
  }

  function daysInJalaliMonth(jy, jm){
    if(jm <= 6) return 31;
    if(jm <= 11) return 30;
    return isLeapJalaliYear(jy) ? 30 : 29;
  }

  // Expense dates are stored directly as Jalali strings: "jy-jm-jd" (zero-padded)
  function formatJalaliDate(jDateStr){
    if(!jDateStr) return '';
    const [jy, jm, jd] = jDateStr.split('-').map(Number);
    if(!jy || !jm || !jd) return '';
    return jd + ' ' + JALALI_MONTHS[jm - 1] + ' ' + jy;
  }

  function getTodayJalali(){
    const now = new Date();
    return gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  }

  function buildMonthOptions(){
    monthSelect.innerHTML = '';
    const todayJ = getTodayJalali();
    for(let i=5;i>=-6;i--){
      const { jy, jm } = shiftJalaliMonth(todayJ.jy, todayJ.jm, -i);
      const opt = document.createElement('option');
      opt.value = jMonthKey(jy, jm);
      opt.textContent = JALALI_MONTHS[jm - 1] + ' ' + jy;
      monthSelect.appendChild(opt);
    }
    monthSelect.value = jMonthKey(todayJ.jy, todayJ.jm);
  }

  // ---- Jalali date-select "trio" helper (day+month+year selects) ----
  // Used twice per book: once for the deposit form, once for the expense form —
  // each is a plain { day, month, year } object of <select> elements.
  function populateDaySelectTrio(trio, jy, jm, preferredDay){
    const days = daysInJalaliMonth(jy, jm);
    const current = preferredDay || Number(trio.day.value) || 1;
    trio.day.innerHTML = '';
    for(let d = 1; d <= days; d++){
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      trio.day.appendChild(opt);
    }
    trio.day.value = Math.min(current, days);
  }

  function buildJalaliDateTrio(trio){
    const todayJ = getTodayJalali();

    trio.month.innerHTML = '';
    JALALI_MONTHS.forEach((name, idx) => {
      const opt = document.createElement('option');
      opt.value = idx + 1;
      opt.textContent = name;
      trio.month.appendChild(opt);
    });
    trio.month.value = todayJ.jm;

    trio.year.innerHTML = '';
    for(let y = todayJ.jy - 5; y <= todayJ.jy + 1; y++){
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      trio.year.appendChild(opt);
    }
    trio.year.value = todayJ.jy;

    populateDaySelectTrio(trio, todayJ.jy, todayJ.jm, todayJ.jd);

    const onYearOrMonthChange = () => populateDaySelectTrio(trio, Number(trio.year.value), Number(trio.month.value));
    trio.year.addEventListener('change', onYearOrMonthChange);
    trio.month.addEventListener('change', onYearOrMonthChange);
  }

  function dateTrioStr(trio){
    const jy = trio.year.value;
    const jm = String(trio.month.value).padStart(2, '0');
    const jd = String(trio.day.value).padStart(2, '0');
    return jy + '-' + jm + '-' + jd;
  }

  function applyParsedDateToTrio(trio, jy, jm, jd){
    if(!jy || !jm || !jd) return;
    const exists = [...trio.year.children].some(o => Number(o.value) === jy);
    if(exists) trio.year.value = jy;
    trio.month.value = jm;
    populateDaySelectTrio(trio, jy, jm, jd);
    const key = jMonthKey(jy, jm);
    const monthExists = [...monthSelect.children].some(o => o.value === key);
    if(monthExists) monthSelect.value = key;
  }

  function getMonthData(bookKey, key){
    const book = data.books[bookKey];
    if(!book.months[key]){
      book.months[key] = { deposits: [], expenses: [] };
    }
    const m = book.months[key];
    // Migrate the old per-contributor income shape (from before the family-budget
    // redesign) into a single deposit entry, so past data isn't lost.
    if(m.income && !m.deposits){
      const total = Object.values(m.income).reduce((s, v) => s + (Number(v) || 0), 0);
      m.deposits = [];
      if(total > 0){
        m.deposits.push({ id: 'legacy-' + key, amount: total, date: key + '-01', note: 'واریزی‌های قدیمی این ماه (قبل از به‌روزرسانی)' });
      }
      delete m.income;
    }
    if(!m.deposits) m.deposits = [];
    if(!m.expenses) m.expenses = [];
    // Migrate old expenses (all category-based) to carry an explicit "kind".
    m.expenses.forEach(e => { if(!e.kind) e.kind = 'category'; });
    return m;
  }

  function migrateDataShape(){
    if(data && data.books) return;
    if(data && data.months){
      // Old single-book format: everything the user already entered becomes Book 1.
      data = { books: { book1: { months: data.months }, book2: { months: {} } } };
    } else {
      data = { books: { book1: { months: {} }, book2: { months: {} } } };
    }
  }

  // ---- Account balance (gardesh-e hesab) ----
  // Deliberately NOT a separately-tracked list of entries: past versions kept a
  // parallel "ledger" that had to be manually kept in sync with income/expenses,
  // and any manually-typed income or expense (not from a parsed SMS) fell out of
  // sync with it. To make the balance ALWAYS correct by construction, it's instead
  // computed directly from the exact same income/expense data shown in the monthly
  // summary, just totaled across every month instead of one — so the two numbers
  // can never disagree.
  function getLedger(bookKey){
    const book = data.books[bookKey];
    if(!book.ledger) book.ledger = { opening: 0 };
    return book.ledger;
  }

  function allTimeIncome(bookKey){
    const book = data.books[bookKey];
    let total = 0;
    Object.values(book.months || {}).forEach(m => {
      (m.deposits || []).forEach(d => { total += Number(d.amount) || 0; });
      // Older months not yet touched via getMonthData() may still be in the
      // legacy per-contributor shape; count those too so totals stay accurate
      // even before that month has been opened once.
      if(m.income){ Object.values(m.income).forEach(v => { total += Number(v) || 0; }); }
    });
    return total;
  }

  function allTimeExpense(bookKey){
    const book = data.books[bookKey];
    let total = 0;
    Object.values(book.months || {}).forEach(m => {
      (m.expenses || []).forEach(e => { total += Number(e.amount) || 0; });
    });
    return total;
  }

  function ledgerBalance(bookKey){
    const l = getLedger(bookKey);
    return (Number(l.opening) || 0) + allTimeIncome(bookKey) - allTimeExpense(bookKey);
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ data = JSON.parse(raw); }
    }catch(e){
      data = { books: { book1: { months: {} }, book2: { months: {} } } };
    }
    migrateDataShape();
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){
      console.error('ذخیره‌سازی ناموفق بود', e);
    }
  }

  function renderExpenseList(book, refs){
    const key = monthSelect.value;
    const m = getMonthData(book.key, key);
    refs.expenseList.innerHTML = '';
    if(m.expenses.length === 0){
      refs.expenseList.innerHTML = '<div class="empty-note">هنوز هزینه‌ای برای این ماه ثبت نشده</div>';
      return;
    }
    const sorted = [...m.expenses].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    sorted.forEach(exp=>{
      let label, color;
      if(exp.kind === 'person'){
        const person = book.contributors.find(c => c.key === exp.personKey);
        label = 'پرداخت به ' + (person ? person.label : '؟');
        color = personColor(book, exp.personKey);
      } else {
        const { group, sub } = resolveExpenseCategory(exp);
        label = group.label + ' &rsaquo; ' + sub.label;
        color = group.color;
      }
      const row = document.createElement('div');
      row.className = 'expense-item';
      row.innerHTML = `
        <span class="cat-dot" style="background:${color}"></span>
        <div class="expense-info">
          <div class="cat">${label}</div>
          <div class="note">${exp.note ? exp.note : formatJalaliDate(exp.date)}</div>
        </div>
        <span class="expense-amt">${fmt(exp.amount)}</span>
        <button class="del-btn" data-id="${exp.id}">✕</button>
      `;
      refs.expenseList.appendChild(row);
    });
    refs.expenseList.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        m.expenses = m.expenses.filter(e=> String(e.id) !== id);
        saveData();
        render(book, refs);

  function renderBreakdownAndSummary(book, refs){
    const key = monthSelect.value;
    const m = getMonthData(book.key, key);

    const totalIncome = m.deposits.reduce((s,d)=> s + (Number(d.amount)||0), 0);
    const totalExpense = m.expenses.reduce((s,e)=> s + (Number(e.amount)||0), 0);
    const balance = totalIncome - totalExpense;

    refs.incomeTotalTxt.textContent = fmt(totalIncome) + ' ریال';
    refs.sumIncome.textContent = fmt(totalIncome);
    refs.sumExpense.textContent = fmt(totalExpense);
    refs.sumBalance.textContent = fmt(balance);
    refs.sumBalance.classList.remove('balance-pos','balance-neg');
    refs.sumBalance.classList.add(balance >= 0 ? 'balance-pos' : 'balance-neg');

    // Breakdown combines two kinds of "where the withdrawals went": shared
    // categories (housing, food, ...) and money given to a specific person —
    // both reduce the budget, so both show up here as slices.
    refs.catBreakdown.innerHTML = '';
    const byLabel = {}; // label -> { amount, color }
    m.expenses.forEach(e=>{
      let label, color;
      if(e.kind === 'person'){
        const person = book.contributors.find(c => c.key === e.personKey);
        label = 'پرداخت به ' + (person ? person.label : '؟');
        color = personColor(book, e.personKey);
      } else {
        const { group } = resolveExpenseCategory(e);
        label = group.label;
        color = group.color;
      }
      if(!byLabel[label]) byLabel[label] = { amount: 0, color };
      byLabel[label].amount += Number(e.amount) || 0;
    });

    if(totalExpense === 0){
      refs.catBreakdown.innerHTML = '<div class="empty-note">با ثبت هزینه، نمودار سهم هر دسته اینجا نمایش داده می‌شود</div>';
      return;
    }

    Object.entries(byLabel).forEach(([label, { amount, color }])=>{
      if(amount === 0) return;
      const pct = totalExpense > 0 ? Math.round((amount/totalExpense)*100) : 0;
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <div class="cat-top">
          <span class="lbl"><span class="cat-dot" style="background:${color}"></span>${label}</span>
          <span class="val">${fmt(amount)} ریال · ${pct}%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background:${color}"></div></div>
      `;
      refs.catBreakdown.appendChild(row);
    });
  }

  function renderLedger(book, refs){
    const l = getLedger(book.key);
    refs.ledgerOpeningInput.value = l.opening ? Number(l.opening).toLocaleString('en-US') : '';

    const balance = ledgerBalance(book.key);
    refs.ledgerBalanceTxt.textContent = fmt(balance) + ' ریال';
    refs.ledgerBalanceTxt.classList.remove('balance-pos','balance-neg');
    refs.ledgerBalanceTxt.classList.add(balance > 0 ? 'balance-pos' : 'balance-neg');

    if(balance <= 0){
      refs.ledgerZeroWarning.style.display = 'block';
      refs.ledgerZeroWarning.textContent = balance === 0
        ? '⚠️ موجودی این حساب به صفر رسیده است.'
        : '⚠️ موجودی این حساب منفی شده است.';
    } else {
      refs.ledgerZeroWarning.style.display = 'none';
    }

    const inTotal = allTimeIncome(book.key);
    const outTotal = allTimeExpense(book.key);
    refs.ledgerList.innerHTML =
      '<div class="empty-note">موجودی اولیه (' + fmt(Number(l.opening) || 0) + ') + مجموع همهٔ واریزی‌ها (' + fmt(inTotal) + ') − مجموع همهٔ هزینه‌های ثبت‌شده (' + fmt(outTotal) + ') در همهٔ ماه‌ها</div>';
  }

  function render(book, refs){
    renderDepositList(book, refs);
    renderExpenseList(book, refs);
    renderBreakdownAndSummary(book, refs);
    renderLedger(book, refs);
  }

  function renderAll(){
    BOOKS.forEach(b => render(b, sections[b.key]));
  }

  // ---- Bank SMS parsing (pure text-processing, no book/DOM dependency) ----
  const ACCOUNT_STORAGE_KEY = 'family-budget-account-v1';

  function normalizeDigits(str){
    const persian = '۰۱۲۳۴۵۶۷۸۹';
    const arabic = '٠١٢٣٤٥٦٧٨٩';
    return str.replace(/[۰-۹٠-٩]/g, (ch) => {
      let idx = persian.indexOf(ch);
      if(idx > -1) return String(idx);
      idx = arabic.indexOf(ch);
      if(idx > -1) return String(idx);
      return ch;
    });
  }

  function normalizeArabicLetters(str){
    return str.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ة/g, 'ه').replace(/ـ/g, '');
  }

  function normalizeSmsText(str){
    return normalizeArabicLetters(normalizeDigits(str || ''));
  }

  // Finds a plausible transaction amount in a string, skipping anything that
  // looks like a card/account/tracking number rather than a Rial amount:
  //  - a number immediately preceded by "کارت"/"حساب"/"شماره"/"شبا"/"پیگیری" is an identifier, not an amount
  //  - a number longer than 12 digits (> 999,999,999,999 Rial) is unrealistic for a personal transaction
  //    and almost certainly a misread card/account/tracking number
  function extractNumberFromText(str){
    const re = /(\d{1,3}(?:[,.\u066C]\d{3})+|\d{4,})/g;
    let m;
    while((m = re.exec(str)) !== null){
      const before = str.slice(Math.max(0, m.index - 16), m.index);
      if(/(کارت|حساب|شماره|شبا|پیگیری|رهگیری)[^0-9]{0,10}$/.test(before)) continue;
      const digits = m[0].replace(/[,.\u066C]/g, '');
      if(digits.length > 12) continue;
      return m[0];
    }
    return null;
  }

  function extractLabeledAmount(str){
    // "مبلغ: 250,000" or "به مبلغ 250000" — the most reliable signal, since the
    // label makes the intent explicit regardless of what else sits on that line.
    const m = str.match(/(?:به\s*)?مبلغ[:\s]*([\d,.\u066C]{4,})/) || str.match(/به\s*میزان[:\s]*([\d,.\u066C]{4,})/);
    if(!m) return null;
    const digits = m[1].replace(/[,.\u066C]/g, '');
    if(digits.length > 12) return null; // guard against an adjacent card/account number bleeding into the label match
    return m[1];
  }

  function parseBankSms(raw){
    const text = normalizeSmsText(raw);
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

    const withdrawKeywords = /برداشت|خرید|کسر|پرداخت|انتقال از حساب|پایانه فروش|کارمزد/;
    const depositKeywords = /واریز|افزایش موجودی|بازگشت وجه/;

    let type = null, txnLine = null;
    for(const line of lines){
      const w = withdrawKeywords.test(line), d = depositKeywords.test(line);
      if(w && !d && !type){ type = 'expense'; txnLine = line; }
      else if(d && !w && !type){ type = 'income'; txnLine = line; }
    }
    if(withdrawKeywords.test(text) && depositKeywords.test(text) && !txnLine) type = null;

    // Priority 1: an explicitly labeled "مبلغ" amount anywhere in the message — most reliable.
    let amountRaw = extractLabeledAmount(text);
    // Priority 2: the transaction line itself, skipping any adjacent card/account/tracking numbers.
    if(!amountRaw && txnLine) amountRaw = extractNumberFromText(txnLine);
    // Priority 3: scan remaining lines, skipping ones that are clearly about account/card/balance.
    if(!amountRaw){
      for(const line of lines){
        if(/حساب|شماره|کارت|موجودی|مانده|شبا/.test(line)) continue;
        const n = extractNumberFromText(line);
        if(n){ amountRaw = n; break; }
      }
    }

    let amount = null;
    if(amountRaw){
      amount = Number(amountRaw.replace(/[,.\u066C]/g, ''));
      const isToman = /تومان/.test(text); // checks the bank SMS wording itself, not our app's display unit
      if(isToman) amount = amount * 10; // app basis is Rial, so convert an explicit Toman amount up
    }

    let jy = null, jm = null, jd = null;
    const fullDate = text.match(/(1[34]\d{2})[\/-](\d{1,2})[\/-](\d{1,2})/);
    if(fullDate){
      jy = Number(fullDate[1]); jm = Number(fullDate[2]); jd = Number(fullDate[3]);
    } else {
      const shortDate = text.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?:[-\s]|$)/m);
      if(shortDate){ jm = Number(shortDate[1]); jd = Number(shortDate[2]); }
    }

    let account = null;
    const accMatch = text.match(/حساب[^\d]{0,3}(\d{6,})/);
    if(accMatch) account = accMatch[1];

    return { type, amount, jy, jm, jd, account };
  }

  function renderSmsResult(refs, html){
    refs.smsResult.innerHTML = html;
  }

  function accountStatusHtml(book, account){
    if(!account) return '';
    const saved = bookAccounts[book.key] || null;
    if(!saved){
      return '<div class="sms-line">شماره حساب شناسایی‌شده: ...' + account.slice(-4) +
        ' &nbsp; <button type="button" class="sms-choice-btn secondary" data-save-acc="' + account + '">تنظیم به‌عنوان حساب ' + book.label + '</button></div>';
    }
    if(account !== saved){
      return '<div class="sms-line sms-warn">⚠️ این پیامک از حسابی غیر از حساب ثبت‌شده برای «' + book.label + '» است.</div>';
    }
    return '';
  }

  function bindAccountStatusButton(book, refs){
    const btn = refs.smsResult.querySelector('[data-save-acc]');
    if(btn){
      btn.addEventListener('click', () => {
        bookAccounts[book.key] = btn.dataset.saveAcc;
        try{ localStorage.setItem(ACCOUNT_STORAGE_KEY, JSON.stringify(bookAccounts)); }catch(e){}
        renderSmsResult(refs, '<div class="sms-line sms-ok">این حساب برای «' + book.label + '» ذخیره شد. از این پس پیامک‌های حساب‌های دیگر با هشدار مشخص می‌شوند.</div>');
      });
    }
  }

  function handleExpenseSms(book, refs, res){
    refs.amountInput.value = res.amount.toLocaleString('en-US');
    applyParsedDateToTrio(refs.expenseDate, res.jy, res.jm, res.jd);
    renderAll(); // the month selector is shared across books, so refresh both
    renderSmsResult(refs,
      accountStatusHtml(book, res.account) +
      '<div class="sms-line sms-ok">برداشت ' + fmt(res.amount) + ' ریال شناسایی شد.</div>' +
      '<div class="sms-line">مبلغ و تاریخ در فرم «ثبت هزینه جدید» همین بخش پر شد؛ مشخص کنید هزینهٔ مشترکه یا پرداخت به یک نفر، بعد «افزودن هزینه» را بزنید.</div>'
    );
    bindAccountStatusButton(book, refs);
    refs.amountInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function handleIncomeSms(book, refs, res){
    // Deposits are family-wide (not attributed to a specific person), so a
    // recognized deposit SMS is recorded straight away — no extra step needed.
    applyParsedDateToTrio(refs.depositDate, res.jy, res.jm, res.jd);
    const key = monthSelect.value; // reflects any month-switch applyParsedDateToTrio just made
    const m = getMonthData(book.key, key);
    m.deposits.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      amount: res.amount,
      note: 'از پیامک بانکی',
      date: dateTrioStr(refs.depositDate)
    });
    saveData();
    renderAll(); // the month selector is shared across books, so refresh both
    renderSmsResult(refs,
      accountStatusHtml(book, res.account) +
      '<div class="sms-line sms-ok">واریزی ' + fmt(res.amount) + ' ریال شناسایی و به بودجه اضافه شد.</div>'
    );
    bindAccountStatusButton(book, refs);
  }

  function handleAmbiguousSms(book, refs, res){
    renderSmsResult(refs,
      accountStatusHtml(book, res.account) +
      '<div class="sms-line">مبلغ ' + fmt(res.amount) + ' ریال شناسایی شد، اما مشخص نشد برداشت است یا واریز:</div>' +
      '<div class="sms-choice-row">' +
        '<button type="button" class="sms-choice-btn" data-mark="expense">این هزینه (برداشت) است</button>' +
        '<button type="button" class="sms-choice-btn secondary" data-mark="income">این واریزی است</button>' +
      '</div>'
    );
    bindAccountStatusButton(book, refs);
    refs.smsResult.querySelector('[data-mark="expense"]').addEventListener('click', () => handleExpenseSms(book, refs, res));
    refs.smsResult.querySelector('[data-mark="income"]').addEventListener('click', () => handleIncomeSms(book, refs, res));
  }

  // ---- Build & wire one independent book section (markup + all event listeners) ----
  function buildSectionMarkup(book){
    const k = book.key;
    return `
      <div class="book-section" data-book="${k}">
        <div class="card">
          <h2>ثبت واریزی جدید به بودجه</h2>
          <div class="form-grid">
            <input id="depositAmountInput-${k}" type="text" inputmode="numeric" placeholder="مبلغ واریزی (ریال)">
            <div class="jalali-date-row">
              <select id="depositDaySelect-${k}"></select>
              <select id="depositMonthSelect-${k}"></select>
              <select id="depositYearSelect-${k}"></select>
            </div>
            <input id="depositNoteInput-${k}" type="text" placeholder="توضیح (اختیاری)">
            <button class="add-btn" id="depositAddBtn-${k}">افزودن واریزی</button>
          </div>
        </div>

        <div class="card">
          <h2>واریزی‌های این ماه</h2>
          <div id="depositList-${k}"></div>
          <div class="income-total">
            <span>جمع واریزی این ماه</span>
            <b id="incomeTotalTxt-${k}">۰ ریال</b>
          </div>
        </div>

        <div class="card">
          <h2>دریافت خودکار از پیامک بانک (${book.bank})</h2>
          <div class="form-grid">
            <textarea id="smsInput-${k}" rows="3" placeholder="متن پیامک بانک را اینجا کپی و پیست کنید"></textarea>
            <div class="two-col">
              <button class="add-btn" id="parseSmsBtn-${k}" type="button">استخراج از پیامک</button>
              <button class="clear-btn" id="clearSmsBtn-${k}" type="button">پاک کردن</button>
            </div>
            <div id="smsResult-${k}"></div>
          </div>
        </div>

        <div class="card">
          <h2>گردش حساب</h2>
          <div class="form-grid">
            <div>
              <label class="ledger-sub" style="display:block;margin-bottom:5px;">موجودی اولیه ثبت‌شده (ریال)</label>
              <input id="ledgerOpeningInput-${k}" type="text" inputmode="numeric" placeholder="0">
            </div>
          </div>
          <div class="income-total">
            <span>موجودی فعلی حساب</span>
            <b id="ledgerBalanceTxt-${k}">۰ ریال</b>
          </div>
          <div id="ledgerZeroWarning-${k}" class="ledger-warn" style="display:none;"></div>
          <div id="ledgerList-${k}" style="margin-top:12px;"></div>
        </div>

        <div class="card">
          <h2>ثبت برداشت / هزینهٔ جدید</h2>
          <div class="form-grid">
            <div class="two-col">
              <button type="button" class="kind-btn active" id="kindCategoryBtn-${k}" data-kind="category">هزینهٔ مشترک</button>
              <button type="button" class="kind-btn" id="kindPersonBtn-${k}" data-kind="person">پرداخت به یک نفر</button>
            </div>
            <div id="categoryFields-${k}">
              <select id="mainCatSelect-${k}"></select>
              <select id="subCatSelect-${k}"></select>
            </div>
            <div id="personFields-${k}" style="display:none;">
              <select id="personSelect-${k}"></select>
            </div>
            <input id="amountInput-${k}" type="text" inputmode="numeric" placeholder="مبلغ (ریال)">
            <div class="jalali-date-row">
              <select id="jDaySelect-${k}"></select>
              <select id="jMonthSelect-${k}"></select>
              <select id="jYearSelect-${k}"></select>
            </div>
            <input id="noteInput-${k}" type="text" placeholder="توضیح (اختیاری)">
            <button class="add-btn" id="addBtn-${k}">افزودن هزینه</button>
          </div>
        </div>

        <div class="card">
          <h2>برداشت‌های ثبت‌شده</h2>
          <div id="expenseList-${k}"></div>
        </div>

        <div class="card">
          <h2>سهم هر دسته و هر نفر از برداشت‌ها</h2>
          <div id="catBreakdown-${k}"></div>
        </div>

        <div class="card">
          <h2>جمع‌بندی ماه</h2>
          <div class="summary-grid">
            <div class="summary-box income">
              <div class="lbl">واریزی</div>
              <div class="num" id="sumIncome-${k}">۰</div>
            </div>
            <div class="summary-box expense">
              <div class="lbl">هزینه</div>
              <div class="num" id="sumExpense-${k}">۰</div>
            </div>
            <div class="summary-box balance">
              <div class="lbl">مانده</div>
              <div class="num" id="sumBalance-${k}">۰</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>بازنشانی این بخش</h2>
          <p class="ledger-sub" style="display:block;margin-bottom:10px;">همه واریزی‌ها، هزینه‌ها و گردش‌حساب «${book.label}» (${book.bank}) برای همیشه پاک می‌شود. روی بخش دیگر اثری ندارد؛ فقط همین بخش پاک می‌شود.</p>
          <button class="danger-btn" id="resetBtn-${k}" type="button">پاک کردن کامل اطلاعات این بخش</button>
        </div>
      </div>
    `;
  }

  function collectRefs(k){
    const g = (name) => document.getElementById(name + '-' + k);
    return {
      root: document.querySelector('.book-section[data-book="' + k + '"]'),
      depositAmountInput: g('depositAmountInput'),
      depositNoteInput: g('depositNoteInput'),
      depositAddBtn: g('depositAddBtn'),
      depositList: g('depositList'),
      depositDate: { day: g('depositDaySelect'), month: g('depositMonthSelect'), year: g('depositYearSelect') },
      incomeTotalTxt: g('incomeTotalTxt'),
      smsInput: g('smsInput'),
      parseSmsBtn: g('parseSmsBtn'),
      clearSmsBtn: g('clearSmsBtn'),
      smsResult: g('smsResult'),
      ledgerOpeningInput: g('ledgerOpeningInput'),
      ledgerBalanceTxt: g('ledgerBalanceTxt'),
      ledgerZeroWarning: g('ledgerZeroWarning'),
      ledgerList: g('ledgerList'),
      kindCategoryBtn: g('kindCategoryBtn'),
      kindPersonBtn: g('kindPersonBtn'),
      categoryFields: g('categoryFields'),
      personFields: g('personFields'),
      personSelect: g('personSelect'),
      mainCatSelect: g('mainCatSelect'),
      subCatSelect: g('subCatSelect'),
      amountInput: g('amountInput'),
      expenseDate: { day: g('jDaySelect'), month: g('jMonthSelect'), year: g('jYearSelect') },
      noteInput: g('noteInput'),
      addBtn: g('addBtn'),
      expenseList: g('expenseList'),
      catBreakdown: g('catBreakdown'),
      sumIncome: g('sumIncome'),
      sumExpense: g('sumExpense'),
      sumBalance: g('sumBalance'),
      resetBtn: g('resetBtn'),
      expenseKind: 'category',
    };
  }

  function buildPersonSelect(book, refs){
    refs.personSelect.innerHTML = '';
    book.contributors.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.label;
      refs.personSelect.appendChild(opt);
    });
  }

  function setExpenseKind(refs, kind){
    refs.expenseKind = kind;
    refs.kindCategoryBtn.classList.toggle('active', kind === 'category');
    refs.kindPersonBtn.classList.toggle('active', kind === 'person');
    refs.categoryFields.style.display = kind === 'category' ? '' : 'none';
    refs.personFields.style.display = kind === 'person' ? '' : 'none';
  }

  function initBookSection(book){
    const refs = collectRefs(book.key);
    sections[book.key] = refs;

    attachThousandsFormatting(refs.amountInput);
    attachThousandsFormatting(refs.depositAmountInput);
    attachThousandsFormatting(refs.ledgerOpeningInput);
    buildCatSelect(refs);
    buildPersonSelect(book, refs);
    buildJalaliDateTrio(refs.expenseDate);
    buildJalaliDateTrio(refs.depositDate);
    setExpenseKind(refs, 'category');

    refs.kindCategoryBtn.addEventListener('click', () => setExpenseKind(refs, 'category'));
    refs.kindPersonBtn.addEventListener('click', () => setExpenseKind(refs, 'person'));

    refs.ledgerOpeningInput.addEventListener('input', () => {
      const l = getLedger(book.key);
      l.opening = getRawNumber(refs.ledgerOpeningInput);
      saveData();
      renderLedger(book, refs);
    });

    refs.depositAddBtn.addEventListener('click', () => {
      const amount = getRawNumber(refs.depositAmountInput);
      if(!amount || amount <= 0){
        refs.depositAmountInput.focus();
        return;
      }
      const key = monthSelect.value;
      const m = getMonthData(book.key, key);
      m.deposits.push({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        amount: amount,
        note: refs.depositNoteInput.value.trim(),
        date: dateTrioStr(refs.depositDate)
      });
      refs.depositAmountInput.value = '';
      refs.depositNoteInput.value = '';
      saveData();
      render(book, refs);
    });

    refs.addBtn.addEventListener('click', () => {
      const amount = getRawNumber(refs.amountInput);
      if(!amount || amount <= 0){
        refs.amountInput.focus();
        return;
      }
      const key = monthSelect.value;
      const m = getMonthData(book.key, key);
      const entry = {
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
        kind: refs.expenseKind,
        amount: amount,
        note: refs.noteInput.value.trim(),
        date: dateTrioStr(refs.expenseDate)
      };
      if(refs.expenseKind === 'person'){
        entry.personKey = refs.personSelect.value;
      } else {
        entry.mainCat = refs.mainCatSelect.value;
        entry.subCat = refs.subCatSelect.value;
      }
      m.expenses.push(entry);
      // No separate ledger bookkeeping needed here — the account balance is
      // computed directly from this same deposits/expenses data (see
      // ledgerBalance()), so it updates automatically and can never fall out of sync.
      refs.amountInput.value = '';
      refs.noteInput.value = '';
      saveData();
      render(book, refs);
    });

    refs.parseSmsBtn.addEventListener('click', () => {
      const res = parseBankSms(refs.smsInput.value);
      if(!res.amount){
        renderSmsResult(refs, accountStatusHtml(book, res.account) + '<div class="sms-line sms-warn">مبلغی در متن پیدا نشد. لطفاً متن پیامک را کامل بچسبانید یا مبلغ را دستی وارد کنید.</div>');
        return;
      }
      if(res.jm && res.jd && !res.jy) res.jy = getTodayJalali().jy;
      refs.smsInput.value = '';
      if(res.type === 'expense') handleExpenseSms(book, refs, res);
      else if(res.type === 'income') handleIncomeSms(book, refs, res);
      else handleAmbiguousSms(book, refs, res);
    });

    refs.clearSmsBtn.addEventListener('click', () => {
      refs.smsInput.value = '';
      renderSmsResult(refs, '');
    });

    refs.resetBtn.addEventListener('click', () => {
      const ok = confirm('همه واریزی‌ها، هزینه‌ها و گردش‌حساب «' + book.label + '» (' + book.bank + ') برای همیشه پاک می‌شود. مطمئنید؟');
      if(!ok) return;
      data.books[book.key] = { months: {}, ledger: { opening: 0 } };
      saveData();
      refs.smsInput.value = '';
      renderSmsResult(refs, '');
      render(book, refs);
    });
  }

  monthSelect.addEventListener('change', renderAll);

  (function init(){
    loadData();
    loadSavedAccounts();
    loadActiveBook();
    buildMonthOptions();
    BOOKS.forEach(b => {
      bookSectionsRoot.insertAdjacentHTML('beforeend', buildSectionMarkup(b));
    });
    BOOKS.forEach(b => initBookSection(b));
    buildBookTabs();
    applyActiveBook();
    renderAll();
  })();

  // ---- PWA install prompt ----
  let deferredPrompt = null;
  const installBar = document.getElementById('installBar');
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBar.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBar.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBar.style.display = 'none';
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
